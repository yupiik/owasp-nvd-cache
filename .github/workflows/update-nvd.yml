name: Update shared OWASP database

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-check-database-publisher
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ODC_VERSION: '13.0.0'
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate API key configuration
        shell: bash
        run: |
          if [[ -z "$NVD_API_KEY" ]]; then
            echo 'Missing NVD_API_KEY repository secret' >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore newest compatible database snapshot
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName \
            --jq '[.[] | select(.tagName | startswith("odc-13.0.0-"))][0].tagName // ""')"
          if [[ -n "$release_tag" ]]; then
            echo "Restoring release: $release_tag"
            gh release download "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern odc-data.tar.gz \
              --pattern odc-data.tar.gz.sha256 \
              --dir "$RUNNER_TEMP"
            (cd "$RUNNER_TEMP" && sha256sum -c odc-data.tar.gz.sha256)
            tar -xzf "$RUNNER_TEMP/odc-data.tar.gz" -C "$RUNNER_TEMP"
          else
            echo 'No compatible snapshot: first update will build a database'
            mkdir -p "$RUNNER_TEMP/odc-data"
          fi

      - name: Update local vulnerability database
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            org.owasp:dependency-check-maven:${ODC_VERSION}:update-only \
            -DdataDirectory="$RUNNER_TEMP/odc-data" \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          test -s "$RUNNER_TEMP/odc-data/odc.mv.db"

      - name: Package and checksum snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/odc-data.tar.gz" -C "$RUNNER_TEMP" odc-data
          (cd "$RUNNER_TEMP" && sha256sum odc-data.tar.gz > odc-data.tar.gz.sha256)
          archive_size="$(stat -c '%s' "$RUNNER_TEMP/odc-data.tar.gz")"
          echo "Compressed snapshot size: ${archive_size} bytes"
          if (( archive_size >= 2147483648 )); then
            echo 'Release asset must be smaller than 2 GiB' >&2
            exit 1
          fi

      - name: Publish immutable snapshot as a GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          release_tag="odc-${ODC_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$release_tag" \
            "$RUNNER_TEMP/odc-data.tar.gz" \
            "$RUNNER_TEMP/odc-data.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dependency-Check ${ODC_VERSION} database $(date -u +%F)" \
            --notes "Read-only OWASP Dependency-Check cache for version ${ODC_VERSION}. Generated by trusted workflow ${GITHUB_RUN_ID}." \
            --target "$GITHUB_SHA" \
            --latest
